<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#09090d" />
        <meta
            name="description"
            content="Challenge lista PLGDPS."
        />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://pinterittejeden-gif.github.io/PLGDPSi-ChallengeList/" />
        <meta property="og:title" content="PLGDPSi Challenge List" />
        <meta property="og:description" content="Challenge i rekordy PLGDPSi." />
        <meta property="og:image" content="https://pinterittejeden-gif.github.io/PLGDPSi-ChallengeList/og.png" />
        <meta property="og:image:alt" content="Polish GDPS Infinity" />
        <meta property="og:image:width" content="1915" />
        <meta property="og:image:height" content="1017" />
        <meta name="twitter:card" content="summary_large_image" />
        <title>PLGDPSi Challenge List</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="ikonka_listy.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="css/reset.css" />
        <link rel="stylesheet" type="text/css" href="css/typography.css" />
        <link rel="stylesheet" type="text/css" href="css/main.css" />
        <link rel="stylesheet" type="text/css" href="css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="css/components/timemachine.css" />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <router-link class="brand" to="/" aria-label="PLGDPSi Challenge List - strona główna">
                <img class="brand__mark" src="ikonka_listy.png" alt="" />
                <span class="brand__copy">
                    <strong>PLGDPSi</strong>
                    <small>CHALLENGELIST</small>
                </span>
            </router-link>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">Lista</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Ranking</span>
                </router-link>
                <div class="nav__actions">
                    <button
                        class="nav__icon"
                        @click.prevent="store.toggleDark()"
                        :aria-label="store.dark ? 'Włącz jasny motyw' : 'Włącz ciemny motyw'"
                        :title="store.dark ? 'Jasny motyw' : 'Ciemny motyw'"
                    >
                        <img
                            :src="store.dark ? 'assets/light.svg' : 'assets/dark.svg'"
                            alt=""
                        />
                    </button>
                    <!-- Replace the '#' with your discord server's invite-->
                    <a class="nav__icon" href="https://discord.gg/plgdps" target="_blank" rel="noopener" aria-label="Discord PLGDPSi">
                        <img src="assets/discord.svg" alt="Discord Logo" />
                    </a>
                    <div class="nav__tm-wrap">
                        <button
                            class="nav__icon nav__tm-toggle"
                            :class="{ active: store.tm.activeDate }"
                            @click="store.tm.open = !store.tm.open"
                            aria-label="Time Machine"
                            title="Time Machine - pokaż listę z wybranego dnia"
                        >
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="12" r="9"></circle>
                                <path d="M12 7.5V12l3.2 1.9"></path>
                            </svg>
                        </button>
                        <div class="nav__tm-backdrop" v-if="store.tm.open" @click="store.tm.open = false"></div>
                        <div class="nav__tm-pop" v-if="store.tm.open">
                            <div class="nav__tm-pop-head">
                                <span class="nav__tm-pop-title">Time Machine</span>
                                <button class="nav__tm-pop-close" @click="store.tm.open = false" aria-label="Zamknij">✕</button>
                            </div>
                            <input type="date" class="nav__tm-input" v-model="store.tm.date" :min="store.tm.min" :max="today" aria-label="Data" />
                            <button class="nav__tm-go" @click="store.tmApply()" :disabled="!store.tm.date || store.tm.loading">
                                {{ store.tm.loading ? "Wczytuję…" : "Pokaż listę z dnia" }}
                            </button>
                            <p class="nav__tm-hint" v-if="store.tm.min">Nie da się cofnąć przed {{ store.tmMinLabel() }} (dzień powstania listy).</p>
                            <button class="nav__tm-reset" v-if="store.tm.activeDate" @click="store.tmReset()">Wróć do teraz</button>
                        </div>
                    </div>
                    <!-- List record submission form, add a link to replace the '#' when putting a link to your list submission form-->
                    <a
                        class="nav__cta type-label-lg"
                        href="https://discord.gg/Ec88nuWx4F"
                        target="_blank"
                        rel="noopener"
                        >Dodaj rekord</a
                    >
                </div>
            </nav>
        </header>
        <div class="tm-toast" v-if="store.tm.error" @click="store.tm.error = ''">{{ store.tm.error }}</div>
        <div class="site-banner" role="img" aria-label="Polish GDPS Infinity"></div>
        <router-view :class="{ dark: store.dark }"></router-view>
    </body>
</html>
